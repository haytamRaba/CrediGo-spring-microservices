name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Config Server
        run: mvn --batch-mode --no-transfer-progress -pl config-server package -DskipTests

      - name: Start Config Server and check service configurations
        shell: bash
        run: |
          nohup java -jar config-server/target/config-server-0.0.1-SNAPSHOT.jar > config-server.log 2>&1 < /dev/null &
          for attempt in {1..60}; do
            ready=true
            for application in clients credit decaissements api-gateway; do
              if ! curl --fail --silent "http://localhost:8888/${application}/default" > /dev/null; then
                ready=false
                break
              fi
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            sleep 2
          done
          cat config-server.log
          exit 1

      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress verify

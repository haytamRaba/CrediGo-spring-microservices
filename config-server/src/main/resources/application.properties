spring.application.name=config-server
server.port=8888
spring.profiles.active=composite
spring.cloud.config.server.composite[0].type=git
spring.cloud.config.server.composite[0].uri=https://github.com/haytamRaba/Credi-Go-.git
spring.cloud.config.server.composite[0].searchPaths=config-repo
spring.cloud.config.server.composite[0].defaultLabel=main
spring.cloud.config.server.composite[0].timeout=5
spring.cloud.config.server.composite[0].username=${CONFIG_GITHUB_USERNAME:}
spring.cloud.config.server.composite[0].password=${CONFIG_GITHUB_TOKEN:}
spring.cloud.config.server.composite[0].refreshRate=60
spring.cloud.config.server.composite[1].type=native
spring.cloud.config.server.composite[1].searchLocations=file:./config-repo
spring.cloud.config.server.failOnCompositeError=false
spring.cloud.config.server.accept-empty=false

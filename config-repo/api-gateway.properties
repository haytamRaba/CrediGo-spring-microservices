spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.server.webflux.routes[0].id=clients
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CLIENTS
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clients/**
spring.cloud.gateway.server.webflux.routes[1].id=credit
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CREDIT
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/credit/**
spring.cloud.gateway.server.webflux.routes[2].id=decaissements
spring.cloud.gateway.server.webflux.routes[2].uri=lb://DECAISSEMENTS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/decaissements/**
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

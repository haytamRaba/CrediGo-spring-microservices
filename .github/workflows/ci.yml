name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Config Server
        run: mvn --batch-mode --no-transfer-progress -pl config-server package -DskipTests

      - name: Run module tests and local smoke checks
        shell: bash
        run: |
          nohup java -jar config-server/target/config-server-0.0.1-SNAPSHOT.jar > config-server.log 2>&1 < /dev/null &
          config_ready=false
          for attempt in {1..60}; do
            ready=true
            for application in clients credit decaissements api-gateway; do
              if ! curl --fail --silent "http://localhost:8888/${application}/default" > /dev/null; then
                ready=false
                break
              fi
            done
            if [ "$ready" = true ]; then
              config_ready=true
              break
            fi
            sleep 2
          done
          if [ "$config_ready" != true ]; then
            cat config-server.log
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress verify
          nohup java -jar discovery/target/discovery-0.0.1-SNAPSHOT.jar > discovery.log 2>&1 < /dev/null &
          nohup java -jar clients/target/clients-0.0.1-SNAPSHOT.jar > clients.log 2>&1 < /dev/null &
          nohup java -jar service-credit/target/credit-0.0.1-SNAPSHOT.jar > credit.log 2>&1 < /dev/null &
          nohup java -jar service-decaissements/target/decaissements-0.0.1-SNAPSHOT.jar > decaissements.log 2>&1 < /dev/null &
          nohup java -jar api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar > api-gateway.log 2>&1 < /dev/null &
          if ! python3 scripts/smoke-test.py; then
            for log in discovery.log clients.log credit.log decaissements.log api-gateway.log; do
              echo "===== $log ====="
              tail -n 80 "$log" || true
            done
            exit 1
          fi

      - name: Run Postman integration collection
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: collection run postman/collections/creditgo --environment postman/environments/local.environment.yaml --no-report-events
